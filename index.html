<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFC 26 — prévia</title></head><body><p id="status">Carregando SFC 26...</p><script>(async()=>{try{if(!window.DecompressionStream)throw Error("Atualize o navegador.");async function inflate(paths){let files=await Promise.all(paths.map(p=>fetch(p).then(r=>{if(!r.ok)throw Error("Falha ao carregar dados");return r.text()})));let raw=Uint8Array.from(atob(files.join("")),c=>c.charCodeAt(0));return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("gzip"))).text()}let html=await inflate(Array.from({length:98},(_,i)=>`data/part${String(i).padStart(3,"0")}.txt`));let extra=await inflate(Array.from({length:2},(_,i)=>`depth/ext${i}.txt`));document.open();document.write(html.replace("</head>","<style id=\"sem-menu-duplicado\">@media (orientation:landscape) and (min-width:650px){html[data-manager=\"yes\"] [data-menu-toggle]:not([aria-expanded=\"true\"]){display:none}}</style>"+"</head>").replace("</body>",extra+"</body>"));document.close()}catch(e){document.getElementById("status").textContent="Não foi possível iniciar o jogo: "+e.message}})();</script></body></html>
